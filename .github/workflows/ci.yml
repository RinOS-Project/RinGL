name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Meson and Ninja
        run: python3 -m pip install --user meson ninja
      - name: Configure
        run: ~/.local/bin/meson setup build
      - name: Build
        run: ~/.local/bin/meson compile -C build
      - name: Test
        run: ~/.local/bin/meson test -C build --print-errorlogs
      - name: Configure public RinGPU bridge
        run: cmake -S . -B build-public -DRINGL_ENABLE_AQUAMARINE_SURFACE=ON
      - name: Build public RinGPU bridge
        run: cmake --build build-public --parallel
      - name: Test public RinGPU bridge dependency
        run: ctest --test-dir build-public/ringpu-public --output-on-failure
