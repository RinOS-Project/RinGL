name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Meson and Ninja
        run: python3 -m pip install --user meson ninja
      - name: Configure
        run: ~/.local/bin/meson setup build
      - name: Build
        run: ~/.local/bin/meson compile -C build
      - name: Test
        run: ~/.local/bin/meson test -C build --print-errorlogs
